<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Faider user manual: setup, every page and control, how-to guides and troubleshooting.">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=satoshi@400,500,700&display=swap">
<title>Faider Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a hardware manual. A sticky contents rail on the left, one reading column, chapters
     headed like console section legends; the hero shows the channel strip, each section a link. */
  :root {
    --paper: #e8eaeb; --sheet: #f6f7f7; --ink: #1c2023; --muted: #5a636c; --rule: #c6ccd0;
    --select: #1f7fa8; --route: #15806a; --bus: #6e52b8; --output: #a8680a; --cut: #b8382c;
    --key-top: #fbfbfa; --key-bot: #d9dcde; --key-ink: #24292d;
    --panel: #2a2c30; --panel-ink: #d9dcdf; --panel-dim: #8e959c;
    --display: "Clash Display", "Segoe UI", sans-serif;
    --body: "Satoshi", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #18191c; --sheet: #202226; --ink: #e2e5e7; --muted: #9aa1a8; --rule: #34383d;
      --select: #3db4e0; --route: #62d6b4; --bus: #b59cf0; --output: #f2a03c; --cut: #ef6a5f;
      --key-top: #45484e; --key-bot: #33363b; --key-ink: #eceef0;
      --panel: #111214; --panel-ink: #d9dcdf; --panel-dim: #7f868d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #18191c; --sheet: #202226; --ink: #e2e5e7; --muted: #9aa1a8; --rule: #34383d;
    --select: #3db4e0; --route: #62d6b4; --bus: #b59cf0; --output: #f2a03c; --cut: #ef6a5f;
    --key-top: #45484e; --key-bot: #33363b; --key-ink: #eceef0;
    --panel: #111214; --panel-ink: #d9dcdf; --panel-dim: #7f868d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 16px); }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.62 var(--body); }
  a { color: var(--select); }
  a:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--select); outline-offset: 2px; }

  /* HERO: the name bar of the manual */
  .hero { background: var(--panel); color: var(--panel-ink); }
  .hero-inner { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 44px 40px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; }
  .eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--panel-dim); }
  .hero h1 { font: 600 clamp(46px, 7vw, 80px)/1 var(--display); letter-spacing: -.01em; margin: 12px 0 14px; text-wrap: balance; }
  .hero h1 em { font-style: normal; color: var(--panel-dim); }
  .hero p { margin: 0; max-width: 60ch; color: var(--panel-ink); opacity: .86; }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 22px; font: 500 12.5px/1.4 var(--mono); color: var(--panel-dim); }
  .hero-meta b { color: var(--panel-ink); font-weight: 500; }

  .strip { display: flex; flex-direction: column; width: 132px; height: 330px; border-radius: 3px; overflow: hidden;
    box-shadow: 0 0 0 1px #0a0a0b, 0 14px 34px rgba(0,0,0,.45); background: #0a0a0b; gap: 1.5px; }
  .strip-sec { display: flex; align-items: flex-start; padding: 5px 8px; text-decoration: none; min-height: 12px;
    font: 600 10px/1 var(--body); letter-spacing: .1em; color: #dcdde0; background: #77787e; transition: filter .15s; }
  .strip-sec.s-header { background: #222021; }
  .strip-sec.s-name { background: #2f6f86; align-items: center; padding-block: 0; }
  .strip-sec:hover { filter: brightness(1.18); }
  .strip-sec span { pointer-events: none; }
  .strip-cap { margin-top: 8px; font: 500 11px/1.3 var(--mono); color: var(--panel-dim); text-align: center; width: 132px; }

  /* LAYOUT */
  .layout { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 80px;
    display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 40px; align-items: start; }
  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow: auto;
    display: grid; gap: 14px; padding-right: 4px; }
  .search { display: grid; gap: 6px; }
  .search label { font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .search select { width: 100%; font: 15px var(--body); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 8px 10px; }
  .hero #hero-intro p { margin: 0; max-width: 60ch; color: var(--panel-ink); opacity: .86; }
  .search input { width: 100%; font: 15px var(--body); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule);
    border-radius: 3px; padding: 9px 11px; }
  .search-status { font: 500 12px/1.3 var(--mono); color: var(--muted); min-height: 1.3em; }
  .toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .toc a { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; border-left: 3px solid transparent;
    color: var(--ink); text-decoration: none; font-size: 14.5px; line-height: 1.3; border-radius: 0 3px 3px 0; }
  .toc a:hover { background: var(--sheet); }
  .toc a.active { border-left-color: var(--select); background: var(--sheet); font-weight: 600; }
  .toc-num { font: 600 12px/1 var(--mono); color: var(--muted); min-width: 1.6em; font-variant-numeric: tabular-nums; }
  .toc-sub { list-style: none; margin: 2px 0 6px; padding: 0 0 0 30px; display: grid; }
  .toc-sub a { font-size: 13px; padding: 3px 10px; color: var(--muted); }
  .toc li.hidden-by-search { display: none; }
  details.toc-mobile { display: none; }

  /* CHAPTERS */
  main { min-width: 0; display: grid; gap: 22px; }
  .chapter { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding-inline: clamp(18px, 4vw, 44px);
    padding-block: 30px 34px; min-width: 0; }
  .chapter[hidden] { display: none !important; }
  .chapter-head { display: flex; align-items: baseline; gap: 14px; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 2px solid var(--ink); }
  .chapter-num { font: 700 15px/1 var(--mono); color: var(--select); font-variant-numeric: tabular-nums; }
  .chapter h2 { font: 700 30px/1.15 var(--body); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
  .chapter h3 { font: 700 19px/1.3 var(--body); letter-spacing: -.005em; margin: 30px 0 10px; color: var(--ink); text-wrap: balance; }
  .chapter h3::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 10px; background: var(--select);
    border-radius: 1px; transform: translateY(-2px); }
  .chapter p, .chapter li { max-width: 70ch; }
  .chapter p { margin: 0 0 12px; }
  .chapter ul, .chapter ol { margin: 0 0 14px; padding-left: 1.3em; display: grid; gap: 5px; }
  .chapter code { font: 500 .86em var(--mono); background: var(--paper); border: 1px solid var(--rule); padding: 1px 5px; border-radius: 3px;
    overflow-wrap: anywhere; }

  .table-wrap { overflow-x: auto; margin: 4px 0 18px; border: 1px solid var(--rule); border-radius: 3px; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; min-width: 520px; }
  th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--rule); }
  tr:last-child td { border-bottom: 0; }
  th { font: 600 11.5px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--paper); }
  thead tr th:empty { padding: 0; }
  td:first-child { white-space: nowrap; }

  /* KEYS: on-screen legends as console keys; keyboard keys as keycaps */
  .key { display: inline-block; font: 700 .72em/1.35 var(--body); letter-spacing: .06em; color: var(--key-ink);
    background: linear-gradient(var(--key-top), var(--key-bot)); border: 1px solid var(--rule); border-bottom-width: 2px;
    border-radius: 3px; padding: 1px 6px 0; white-space: nowrap; vertical-align: 1px; }
  .combo { white-space: nowrap; }
  kbd { font: 500 .8em/1.3 var(--mono); color: var(--key-ink); background: var(--key-top); border: 1px solid var(--rule);
    border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; margin: 0 1px; }

  .note { margin: 6px 0 18px; padding: 12px 16px; border-left: 4px solid var(--output); background: var(--paper); border-radius: 0 3px 3px 0; }
  .note p { margin: 0; }

  /* TROUBLESHOOTING */
  details.trouble { border: 1px solid var(--rule); border-radius: 3px; margin: 10px 0; background: var(--sheet); }
  details.trouble > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    font: 600 16.5px/1.3 var(--body); }
  details.trouble > summary::-webkit-details-marker { display: none; }
  details.trouble > summary::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--cut);
    box-shadow: 0 0 6px var(--cut); }
  details.trouble[open] > summary::before { background: var(--route); box-shadow: 0 0 6px var(--route); }
  details.trouble > summary::after { content: "+"; margin-left: auto; font: 500 18px var(--mono); color: var(--muted); }
  details.trouble[open] > summary::after { content: "−"; }
  .trouble-body { padding: 0 16px 6px; }

  /* DIAGRAMS */
  .diagram { margin: 8px 0 22px; }
  .diagram figcaption { margin-top: 10px; font-size: 13.5px; color: var(--muted); max-width: 70ch; }
  .window { display: grid; grid-template-columns: 150px minmax(0, 1fr); grid-template-rows: auto auto; border-radius: 4px;
    overflow: hidden; background: #0a0a0b; gap: 1px; font: 600 10px/1.2 var(--body); letter-spacing: .08em; color: #c9cbce; }
  .window figcaption { grid-column: 1 / -1; background: var(--sheet); padding-top: 10px; letter-spacing: 0; font: 13.5px/1.5 var(--body); margin: 0; }
  .w-side { background: #2b2d30; padding: 10px 8px; display: flex; flex-direction: column; gap: 5px; min-height: 270px; }
  .w-brand { color: #9aa0a6; padding: 2px 4px 6px; }
  .w-card { background: #313337; border-radius: 2px; padding: 6px 8px; }
  .w-card.on { background: #4a4d52; box-shadow: inset 3px 0 0 #3db4e0; color: #fff; }
  .w-group { color: #9aa0a6; padding: 10px 4px 2px; font-size: 9.5px; }
  .w-bottom { margin-top: auto; }
  .w-main { display: grid; grid-template-rows: auto auto 1fr; gap: 1px; min-width: 0; }
  .w-top, .w-transport { background: #222326; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .w-scenes { display: flex; gap: 4px; } .w-scenes i { width: 34px; height: 12px; background: #3a3c40; border-radius: 2px; }
  .w-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .lamp { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4fd07a; box-shadow: 0 0 6px #4fd07a; }
  .w-clock { font: 600 13px var(--mono); color: #62d6b4; background: #0d1110; padding: 3px 8px; border-radius: 2px; }
  .w-track { color: #62d6b4; } .w-keys { margin-left: auto; letter-spacing: .3em; color: #9aa0a6; }
  .w-page { background: #16171a; position: relative; display: grid; place-items: center; min-height: 160px; overflow: hidden; }
  .w-page span { position: relative; color: #8e959c; letter-spacing: .2em; }
  .w-strips { position: absolute; inset: 10px; display: flex; gap: 4px; opacity: .55; }
  .w-strips i { flex: 1; background: linear-gradient(#222021 0 14%, #77787e 14% 86%, #2f6f86 86% 89%, #77787e 89%); border-radius: 1px; }
  .w-strips i:nth-child(n+6) { background: linear-gradient(#222021 0 14%, #77787e 14% 86%, #3a2d4c 86% 89%, #77787e 89%); }
  .w-strips i:nth-child(n+8) { background: linear-gradient(#222021 0 14%, #16181a 14% 86%, #4a3816 86% 89%, #16181a 89%); }

  .flow-row { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; counter-reset: none; }
  .flow-row li { position: relative; flex: 1 1 140px; min-width: 0; padding: 10px 12px; background: var(--paper); border: 1px solid var(--rule);
    border-top: 3px solid var(--route); border-radius: 3px; display: grid; gap: 3px; }
  .flow-row li.bus { border-top-color: var(--bus); } .flow-row li.out { border-top-color: var(--output); } .flow-row li.dev { border-top-color: var(--muted); }
  .flow-row li b { font: 600 12.5px/1.2 var(--body); letter-spacing: .07em; }
  .flow-row li span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
  .flow-row li:not(:last-child)::after { content: "→"; position: absolute; right: -17px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font: 600 14px var(--mono); }

  /* SCREENSHOTS: framed like a display, click to enlarge */
  .shots { display: grid; gap: 14px; margin: 6px 0 22px; }
  .shots.row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
  .shots.row .shot { width: min-content; }   /* (each frame its image's size; the caption wraps to it) */
  .shot { margin: 0; display: grid; gap: 7px; min-width: 0; }
  .shot-open { display: block; padding: 0; border: 1px solid var(--rule); border-radius: 4px; background: #0a0a0b; cursor: zoom-in;
    overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.18); max-width: 100%; width: fit-content; justify-self: start; }
  .shot-open img { display: block; max-width: 100%; height: auto; }
  .shots.row .shot-open img { height: 620px; width: auto; max-width: none; }
  @media (max-width: 640px) { .shots.row .shot { width: auto; } .shots.row .shot-open img { height: auto; max-width: 100%; } }
  .shot figcaption { font-size: 13px; color: var(--muted); max-width: 70ch; }
  .lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(8,9,10,.92); display: grid; place-items: center; padding: 24px 16px; cursor: zoom-out; }
  .lightbox[hidden] { display: none !important; }
  .lightbox img { max-width: 100%; max-height: calc(100vh - 80px); width: auto; height: auto; border-radius: 3px; }
  .lightbox p { margin: 10px 0 0; color: #c9cbce; font-size: 14px; text-align: center; }

  footer.page-foot { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; color: var(--muted); font-size: 13px; }

  @media (max-width: 920px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .rail { position: static; max-height: none; overflow: visible; }
    .rail .toc-desktop { display: none; }
    details.toc-mobile { display: block; background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; }
    details.toc-mobile > summary { cursor: pointer; padding: 10px 12px; font: 600 14px var(--body); letter-spacing: .06em; text-transform: uppercase; }
    details.toc-mobile .toc { padding: 0 6px 8px; }
  }
  @media (max-width: 640px) {
    .hero-inner { grid-template-columns: minmax(0, 1fr); }
    .strip-wrap { display: none; }
    .chapter h2 { font-size: 25px; }
    .window { grid-template-columns: minmax(0, 1fr); }
    .w-side { min-height: 0; flex-direction: row; flex-wrap: wrap; }
    .w-group, .w-bottom { display: none; }
    .flow-row li:not(:last-child)::after { display: none; }
  }

  /* SITE BAR: back to the home page, the download */
  .site-bar { background: var(--panel); color: var(--panel-ink); border-bottom: 1px solid rgba(255,255,255,.08); }
  .site-bar-inner { max-width: 1240px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .site-bar a { color: var(--panel-dim); text-decoration: none; font: 600 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; transition: color .2s; }
  .site-bar a:hover { color: var(--panel-ink); }
  .site-bar .home { display: flex; align-items: center; gap: 10px; color: var(--panel-ink); margin-right: auto; }
  .site-bar .home img { width: 24px; height: 24px; }
  .site-bar .dl { color: #10261a; background: linear-gradient(#7ef0a4, #46c873); padding: 8px 12px; border-radius: 3px; box-shadow: 0 0 16px rgba(94,224,138,.3); }
  .site-bar .dl:hover { color: #10261a; box-shadow: 0 0 24px rgba(94,224,138,.5); }
</style>

<header class="site-bar"><div class="site-bar-inner">
  <a class="home" href="./"><img src="assets/icon.png" alt="">Faider</a>
  <a href="./#features">Features</a>
  <a href="https://github.com/dayztoolsforu/faider">GitHub</a>
  <a class="dl" data-download href="https://github.com/dayztoolsforu/faider/releases">Download</a>
</div></header>
<div class="hero">
  <div class="hero-inner">
    <div>
      <div class="eyebrow" id="hero-eyebrow">User manual</div>
      <h1>Faider <em id="hero-em">Manual</em></h1>
      <div id="hero-intro"></div>
      <div class="hero-meta"><span id="hero-version"></span></div>
    </div>
    <div class="strip-wrap" aria-label="The channel strip: click a section to read about it">
      <nav class="strip">{{STRIP}}</nav>
      <div class="strip-cap" id="strip-cap"></div>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="rail">
    <div class="search">
      <label for="lang" id="lang-label">Language</label>
      <select id="lang">{{LANG_OPTIONS}}</select>
    </div>
    <div class="search">
      <label for="q" id="q-label">Search the manual</label>
      <input id="q" type="search" autocomplete="off">
      <div class="search-status" id="search-status" aria-live="polite"></div>
    </div>
    <details class="toc-mobile"><summary id="toc-mobile-title">Contents</summary><ol class="toc" id="toc-mobile"></ol></details>
    <nav class="toc-desktop" aria-label="Contents"><ol class="toc" id="toc"></ol></nav>
  </aside>
  <main id="manual"></main>
</div>
<div class="lightbox" id="lightbox" hidden><div><img id="lightbox-img" alt=""><p id="lightbox-cap"></p></div></div>
<footer class="page-foot">Faider user manual. Version 0.1.</footer>

<script id="shots-data" type="application/json">{{SHOTS}}</script>
{{TEMPLATES}}
<script>
(() => {
  const shots = JSON.parse(document.getElementById('shots-data').textContent);
  const $ = id => document.getElementById(id);
  const q = $('q'), status = $('search-status'), picker = $('lang');
  let chapters = [], text = [], chrome = [], io = null;

  function mount(code) {
    const tpl = $('lang-' + code) || $('lang-en');
    code = tpl.id.slice(5);
    const hero = JSON.parse(tpl.dataset.hero);
    chrome = hero.chrome;
    document.documentElement.lang = code;
    $('hero-eyebrow').textContent = hero.title;
    $('hero-em').textContent = hero.title;
    $('hero-intro').innerHTML = hero.intro;
    $('hero-version').textContent = hero.version;
    $('strip-cap').textContent = chrome[6];
    $('lang-label').textContent = chrome[7];
    $('q-label').textContent = chrome[0];
    q.placeholder = chrome[1];
    $('toc-mobile-title').textContent = chrome[2];
    const toc = tpl.content.querySelector('[data-part="toc"]').innerHTML;
    $('toc').innerHTML = toc;
    $('toc-mobile').innerHTML = toc;
    $('manual').innerHTML = tpl.content.querySelector('[data-part="main"]').innerHTML;
    document.querySelectorAll('img[data-shot]').forEach(img => { img.src = shots[img.dataset.shot] || ''; });
    chapters = [...document.querySelectorAll('.chapter')];
    text = chapters.map(c => c.textContent.toLowerCase());
    picker.value = code;
    try { localStorage.setItem('manual-lang', code); } catch (e) {}
    if (q.value) search();
    watch();
  }

  // The chapter in view, lit in the contents.
  function watch() {
    if (!('IntersectionObserver' in window)) return;
    if (io) io.disconnect();
    const links = [...document.querySelectorAll('#toc > li > a')];
    const byId = new Map(links.map(a => [a.getAttribute('href').slice(1), a]));
    const seen = new Map();
    io = new IntersectionObserver(entries => {
      entries.forEach(e => seen.set(e.target.id, e.isIntersecting ? e.boundingClientRect.top : null));
      let best = null, bestTop = Infinity;
      seen.forEach((top, id) => { if (top !== null && Math.abs(top) < bestTop) { best = id; bestTop = Math.abs(top); } });
      if (best) links.forEach(a => a.classList.toggle('active', a === byId.get(best)));
    }, { rootMargin: '-10% 0px -70% 0px' });
    chapters.forEach(c => io.observe(c));
  }

  // Search: only the chapters that mention every word typed.
  function search() {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    let shown = 0;
    chapters.forEach((c, i) => { const hit = words.every(w => text[i].includes(w)); c.hidden = !hit; if (hit) shown++; });
    document.querySelectorAll('.toc > li').forEach(li => {
      const ch = document.getElementById(li.querySelector('a').getAttribute('href').slice(1));
      li.classList.toggle('hidden-by-search', ch ? ch.hidden : false);
    });
    status.textContent = !words.length ? '' : shown === 1 ? chrome[4] : shown ? chrome[3].replace('{n}', shown) : chrome[5];
  }
  q.addEventListener('input', search);
  picker.addEventListener('change', () => mount(picker.value));

  // Screenshots open full size; a click or Esc closes them.
  const box = $('lightbox'), boxImg = $('lightbox-img'), boxCap = $('lightbox-cap');
  document.addEventListener('click', e => {
    const b = e.target.closest('.shot-open');
    if (b) { const img = b.querySelector('img'); boxImg.src = img.src; boxImg.alt = img.alt; boxCap.textContent = img.alt; box.hidden = false; return; }
    const a = e.target.closest('a[href^="#"]'); if (!a) return;
    const t = document.getElementById(a.getAttribute('href').slice(1));
    if (t && t.tagName === 'DETAILS') t.open = true;
    if (t && t.closest('.chapter[hidden]')) { q.value = ''; search(); }
  });
  box.addEventListener('click', () => { box.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') box.hidden = true; });

  // A link to a troubleshooting entry opens it.
  const openTarget = () => { const t = location.hash && document.getElementById(location.hash.slice(1)); if (t && t.tagName === 'DETAILS') t.open = true; };
  window.addEventListener('hashchange', openTarget);

  // The language: the reader's last choice, else the browser's, else English.
  let start = new URLSearchParams(location.search).get('lang') || '';
  if (start && !document.getElementById('lang-' + start)) start = '';
  if (!start) { try { start = localStorage.getItem('manual-lang') || ''; } catch (e) {} }
  if (!start) {
    const want = (navigator.languages || [navigator.language || 'en']).map(l => l.toLowerCase());
    const have = [...picker.options].map(o => o.value);
    start = want.map(w => have.find(h => h.toLowerCase() === w) || have.find(h => h.toLowerCase().split('-')[0] === w.split('-')[0])).find(Boolean) || 'en';
    if (want.some(w => w.startsWith('zh'))) start = have.includes('zh-Hans') ? 'zh-Hans' : start;
  }
  mount(start);
  openTarget();
  // A link straight to a chapter: the chapters only exist now, so go there now
  const goToHash = () => { const t = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView({ behavior: 'instant', block: 'start' }); };
  goToHash();
  window.addEventListener('load', goToHash, { once: true });   // (again once fonts and screenshots have their size)
})();
</script>
<script>
fetch('https://api.github.com/repos/dayztoolsforu/faider/releases?per_page=1').then(r => r.ok ? r.json() : []).then(rs => {
  const exe = rs[0] && (rs[0].assets || []).find(a => /Setup\.exe$/i.test(a.name));
  if (exe) document.querySelectorAll('[data-download]').forEach(a => { a.href = exe.browser_download_url; });
}).catch(() => {});
</script>
