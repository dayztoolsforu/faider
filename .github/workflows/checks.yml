name: Checks

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

permissions:
  contents: read

# A new push makes the run before it pointless, so it is stopped.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build the program and run the checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Show the toolchain
        run: |
          cmake --version
          git --version

      # The website (docs/index.html) is built from the manual, its translations and CREDITS.md: the
      # committed page has to be what they build now. build.py also fails on a translation whose
      # headings differ, a missing image or a link to nowhere. (markdown pinned: another version
      # could write the same page slightly differently)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the website
        run: |
          python -m pip install --disable-pip-version-check markdown==3.11.3
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/manual-page/build.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check the committed website is up to date
        run: git diff --exit-code docs/index.html docs/manual.html docs/CREDITS.html

      # The program is built here, without the ASIO SDK (it is licensed separately and
      # is not redistributed): the build then runs on Windows devices only, which is
      # enough to catch a broken build.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build the program
        run: cmake --build build --config Release --target Faider

      # AppCaptureTest is left out: it needs an audio output device to capture from,
      # and a build machine has none. It runs with the rest on a machine that has one.
      - name: Run the checks
        run: >-
          powershell -ExecutionPolicy Bypass -File tools\run-tests.ps1
          -Tests MeterTest,PadsTest,TapeTest,NoiseReducerTest,VoiceChainTest,TriggerTest,RecorderTest,BuffersTest,ThemeTest,SessionTest
