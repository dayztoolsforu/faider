<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body class="doc">
  <header class="bar">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/icon.png' | relative_url }}" alt=""><span>PATCHBAY CONSOLE</span></a>
    <nav>
      <a href="{{ '/' | relative_url }}">HOME</a>
      <a href="{{ '/manual.html' | relative_url }}">MANUAL</a>
      <details class="langs">
        <summary>LANGUAGE</summary>
        <div>
          <a href="{{ '/manual.html' | relative_url }}?lang=en">English</a>
          <a href="{{ '/manual.html' | relative_url }}?lang=es">Español</a>
          <a href="{{ '/manual.html' | relative_url }}?lang=fr">Français</a>
          <a href="{{ '/manual.html' | relative_url }}?lang=de">Deutsch</a>
          <a href="{{ '/manual.html' | relative_url }}?lang=it">Italiano</a>
          <a href="{{ '/manual.html' | relative_url }}?lang=pt-BR">Português (Brasil)</a>
          <a href="{{ '/manual.html' | relative_url }}?lang=nl">Nederlands</a>
          <a href="{{ '/manual.html' | relative_url }}?lang=pl">Polski</a>
          <a href="{{ '/manual.html' | relative_url }}?lang=sv">Svenska</a>
          <a href="{{ '/manual.html' | relative_url }}?lang=tr">Türkçe</a>
          <a href="{{ '/manual.html' | relative_url }}?lang=ja">日本語</a>
          <a href="{{ '/manual.html' | relative_url }}?lang=ko">한국어</a>
          <a href="{{ '/manual.html' | relative_url }}?lang=zh-Hans">简体中文</a>
        </div>
      </details>
      <a href="https://github.com/{{ site.repository }}">GITHUB</a>
      <a class="key lit" data-download href="https://github.com/{{ site.repository }}/releases">DOWNLOAD</a>
    </nav>
  </header>
  <div class="docwrap">
    <aside class="toc" aria-label="Sections"><div class="toc-title">SECTIONS</div><ol id="toc"></ol></aside>
    <main class="prose">
      {{ content }}
    </main>
  </div>
  <footer class="foot">
    <span>Patchbay Console is free software under the GNU AGPLv3.</span>
    <a href="https://github.com/{{ site.repository }}">Source on GitHub</a>
  </footer>
  <script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
