<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body class="doc">
  <header class="bar">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/icon.png' | relative_url }}" alt=""><span>FAIDER</span></a>
    <nav>
      <a href="{{ '/' | relative_url }}">HOME</a>
      <a href="{{ '/manual.html' | relative_url }}">MANUAL</a>
      <a href="https://github.com/{{ site.repository }}">GITHUB</a>
      <a class="key lit" data-download href="https://github.com/{{ site.repository }}/releases">DOWNLOAD</a>
    </nav>
  </header>
  <div class="docwrap">
    <aside class="toc" aria-label="Sections"><div class="toc-title">SECTIONS</div><ol id="toc"></ol></aside>
    <main class="prose">
      {{ content }}
    </main>
  </div>
  <footer class="foot">
    <span>Faider is free software under the GNU AGPLv3.</span>
    <a href="https://github.com/{{ site.repository }}">Source on GitHub</a>
  </footer>
  <script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
